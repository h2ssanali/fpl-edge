name: probe-worker
on:
  push:
    branches: [claude/adoring-einstein-17yki4]
    paths: [.github/workflows/probe-worker.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          W=https://arkilo.hassanalialqaruti.workers.dev
          echo "HEALTH: $(curl -s -m 20 $W/health)"
          echo "REDEEM-BAD: $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"code":"NOPE-NOPE","device":"probe-device-123"}' $W/gate/redeem) [$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"code":"NOPE-NOPE","device":"probe-device-123"}' $W/gate/redeem)]"
          echo "VERIFY-BAD: $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"token":"abc.def"}' $W/gate/verify)"
          echo "RELAY: $(curl -s -m 30 $W/api/entry/895045/ | head -c 160)"
          echo "CORS: $(curl -s -m 20 -I -X OPTIONS -H 'Origin: https://h2ssanali.github.io' $W/gate/redeem | grep -i 'access-control-allow-origin' | tr -d '\r')"
          echo "BLOCKED: $(curl -s -o /dev/null -w '%{http_code}' $W/api/my-team/)"
