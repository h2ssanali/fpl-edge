name: probe-proxy
on:
  push:
    branches: [claude/adoring-einstein-17yki4]
    paths: [.github/workflows/probe-proxy.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for T in "https://fantasy.premierleague.com/api/entry/895045/" "https://fantasy.premierleague.com/api/entry/895045/event/8/picks/" "https://fantasy.premierleague.com/api/leagues-classic/314/standings/"; do
            for H in "" "X-Return-Format: text" ; do
              curl -s -m 30 -D h.txt -o b.txt -H "Origin: https://h2ssanali.github.io" ${H:+-H "$H"} "https://r.jina.ai/$T"
              echo "=== $T [$H] status: $(head -1 h.txt) $(grep -i 'access-control-allow\|ratelimit\|x-ratelimit' h.txt | tr -d '\r' | tr '\n' ' ')"
              python3 - <<'PY'
          import json,re
          s=open('b.txt').read()
          i=min([x for x in [s.find('{'),s.find('[')] if x>=0] or [0])
          try:
            d=json.loads(s[i:]); print('PARSE OK', type(d).__name__, list(d.keys())[:6] if isinstance(d,dict) else len(d))
          except Exception as e:
            print('PARSE FAIL', e, repr(s[:300]))
          PY
            done
          done
          # burst test: 25 quick requests
          ok=0; lim=0
          for i in $(seq 1 25); do c=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Return-Format: text" "https://r.jina.ai/https://fantasy.premierleague.com/api/entry/$((895045+i))/"); [ "$c" = "200" ] && ok=$((ok+1)); [ "$c" = "429" ] && lim=$((lim+1)); done
          echo "BURST ok=$ok limited=$lim"
          # preflight check
          curl -s -o /dev/null -D - -X OPTIONS -H "Origin: https://h2ssanali.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-return-format" "https://r.jina.ai/https://fantasy.premierleague.com/api/entry/1/" | grep -i "^HTTP\|access-control"
