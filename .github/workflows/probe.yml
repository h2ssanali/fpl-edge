name: probe
on:
  push:
    branches: [claude/adoring-einstein-17yki4]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set -x
          UA="Mozilla/5.0 (FPL-Edge probe)"
          B=https://fantasy.premierleague.com/api
          curl -sS -A "$UA" $B/bootstrap-static/ -o boot.json
          python3 - <<'PY'
          import json
          b=json.load(open('boot.json'))
          print("TOPKEYS", list(b.keys()))
          for k in ['events','teams','elements','element_types','phases','chips','game_settings','game_config','element_stats','total_players']:
            v=b.get(k)
            if isinstance(v,list) and v:
              print("KEY",k,len(v)); print(json.dumps(v[0])[:4000])
            else: print("KEY",k,json.dumps(v)[:3000])
          cur=[e for e in b['events'] if e.get('is_current')]; nxt=[e for e in b['events'] if e.get('is_next')]
          print("CURRENT", json.dumps(cur)[:3000]); print("NEXT", json.dumps(nxt)[:1500])
          top=sorted(b['elements'],key=lambda e:-e['total_points'])[0]
          print("TOPPLAYER", json.dumps(top))
          open('cur','w').write(str(cur[0]['id'] if cur else 1)); open('top','w').write(str(top['id']))
          PY
          GW=$(cat cur); P=$(cat top)
          curl -sS -A "$UA" $B/fixtures/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('FIXTURES',len(d));print(json.dumps(d[0])[:3000]);f=[x for x in d if x['finished']];print(json.dumps(f[-1])[:6000])"
          curl -sS -A "$UA" $B/element-summary/$P/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('ESUM',list(d.keys()));[print(k,len(d[k]),json.dumps(d[k][:2])[:3000]) for k in d]"
          curl -sS -A "$UA" "$B/leagues-classic/314/standings/" | python3 -c "import json,sys;d=json.load(sys.stdin);print('LEAGUE',list(d.keys()));print(json.dumps(d)[:3000])"
          TOP=$(curl -sS -A "$UA" "$B/leagues-classic/314/standings/" | python3 -c "import json,sys;print(json.load(sys.stdin)['standings']['results'][0]['entry'])")
          curl -sS -A "$UA" $B/entry/$TOP/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('ENTRY',json.dumps(d)[:5000])"
          curl -sS -A "$UA" $B/entry/$TOP/history/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('HIST',list(d.keys()));[print(k,json.dumps(d[k])[:2500]) for k in d]"
          curl -sS -A "$UA" $B/entry/$TOP/event/$GW/picks/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('PICKS',json.dumps(d)[:4000])"
          curl -sS -A "$UA" $B/entry/$TOP/transfers/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('TRANSFERS',len(d),json.dumps(d[:3])[:2000])"
          curl -sS -A "$UA" $B/event/$GW/live/ | python3 -c "import json,sys;d=json.load(sys.stdin);print('LIVE',list(d.keys()),len(d['elements']));print(json.dumps(d['elements'][0])[:3000])"
          curl -sS -A "$UA" $B/event-status/ | head -c 1500; echo
          curl -sS -A "$UA" $B/fixtures/?event=$GW | head -c 300; echo
